name: Lumina Windows preview

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "lumina-dotnet/**"
      - ".github/workflows/lumina-windows.yml"

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Download and verify local embedding model
        shell: pwsh
        run: ./lumina-dotnet/setup.ps1

      - name: Build Lumina
        run: dotnet build ./lumina-dotnet/ChatAnalyzer.slnx -c Release --nologo

      - name: Publish self-contained Windows app
        run: dotnet publish ./lumina-dotnet/ChatAnalyzer.Desktop/ChatAnalyzer.Desktop.csproj -c Release -r win-x64 --self-contained true -o ./lumina-artifact --nologo

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: Lumina-win-x64
          path: ./lumina-artifact
          if-no-files-found: error
